name: zte ums9620 kernel-src
description: 'ZTE UMS9620 (MiFi F50) 内核代码'
runs:
  using: "composite"
  steps:
    # 不做源码缓存：缓存的树可能是上次打过补丁/编译过的旧状态，
    # 会导致 001/002 补丁 "Reversed patch detected" 或体积过大。
    # 每次全新 checkout（约 15s），保证干净源码。
    - name: Checkout ZTE UMS9620 Kernel Source
      uses: actions/checkout@v4
      with:
        repository: 'Enceka/android_kernel_zte_ums9620_mifi_f50'
        ref: 'main'
        fetch-depth: 1
        path: 'kernel-src'
